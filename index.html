g the history of a German pharmacy, catalogued via Kalliope portal (Historischer Fragebogen 1924/1948 und Karteikarten, ggf. gemeinfreie Anlagen zur Apothekengeschichte; als Katalog dient das Nachlassportal Kalliope): https://kalliope-verbund.info/DE-611-BF-70963 [Funktion: Im Findbuch anzeigen]   Please note: The Kalliope catalogue entry might indicate related material in the archival folder which cannot be published due to copyright or other legal restrictions (NB: Das Katalogisat bei Kalliope kann auch auf Materialien - teils erheblichen Umfangs - verweisen, die aus archiv- oder urheberrechtlichen Gründen nicht veröffentlicht werden dürfen).","language":"de","date":"","notes":"","tags":"","editors":"","bookAuthor":"","extra":""},{"id":"ILEF4RLL","title":"Über glaziäre Stauchungen in den Mellendorfer und Brelinger Bergen nördlich von Hannover .","authors":["Lang, Hans Dietrich"],"authorText":"Lang, Hans Dietrich","year":"1964","type":"journalArticle","publication":"E&G Quaternary Science Journal","publisher":"","place":"","pages":"207-220","isbn":"","issn":"2199-9090","doi":"10.3285/eg.15.1.16","url":"https://egqsj.copernicus.org/articles/15/207/1964/","archive":"","archiveLocation":"","libraryCatalog":"DOI.org (Crossref)","abstract":"Abstract. The Mellendorf and Brelingen hills are part of the large chain of contorted endmoraines (Drenthe stadial) which can be followed from the Netherlands to the region north of Braunschweig. The clay occurrences near Mellendorf, parts of them well-known for a long time, are blocks or overthrusts transported there by glacial movements. The dip of the tilted beds and the strike of clay occurrences indicate glacial thrusts from ENE, from W, TOW and from N. The dip of tilted sands and gravels in the Brelingen hills, however, points to a direction of ice motion from N to S. Micropalaeontological investigations in the clays of the Mellendorf and Brelingen hills have revealed the existence of foraminifera of Lower Cretaceous age, beginning with the Hauterivian, and a few of them also of the Upper Cretaceous. The proved thrust directions point to regions where the respective old beds of the Lower Cretaceous are exposed. Accordingly the length of transport must have been about 7—8 km. The slightly undulating country around Mellendorf is covered by a sheet of till. After the contortion, the ice advanced over the Mellendorf hills in a southern direction. The Brelingen hills, showing very recent relief and without a covering till, are younger and belong to a later recessional phase; the ice did not override them. The investigations demonstrate that three, perhaps even four, glacial thrusts of the Drenthe stadial took part in the genesis of this region.","language":"en","date":"1964-11-01","notes":"","tags":"","editors":"","bookAuthor":"","extra":""},{"id":"PAZXJMIB","title":"Ein Faustkeil aus dem alten Leinetal in der Wietze-Niederung bei Meitze, Gem. Wedemark, Ldkr. Hannover","authors":["Oldenburg, Heinz"],"authorText":"Oldenburg, Heinz","year":"1985","type":"journalArticle","publication":"","publisher":"NN","place":"","pages":"","isbn":"","issn":"","doi":"10.11588/DIGLIT.75709.14","url":"https://digi.ub.uni-heidelberg.de/diglit/kunde1985/0301","archive":"","archiveLocation":"","libraryCatalog":"DOI.org (Datacite)","abstract":"","language":"de","date":"1985","notes":"","tags":"","editors":"","bookAuthor":"","extra":""},{"id":"ZWY73YGK","title":"Welfenschriften","authors":["Hummel, Carz"],"authorText":"Hummel, Carz","year":"","type":"document","publication":"","publisher":"","place":"","pages":"","isbn":"","issn":"","doi":"","url":"","archive":"Vorhanden in der GWLB Hannover (verschiedene Signaturen) von 1.2007 bis 110.2017","archiveLocation":"","libraryCatalog":"","abstract":"","language":"","date":"","notes":"","tags":"","editors":"","bookAuthor":"","extra":"Hinweis von Petra Grünberg, könnte im Museum liegen"},{"id":"4D5J9PS9","title":"Schulgeschichte Bissendorf","authors":["Hahn, Hellmuth","Lüddec  const text=[cols.map(c=>cell(c[0])).join(';'),...list.map(x=>cols.map(c=>cell(c[1]==='type'?labelType(x[c[1]]):x[c[1]])).join(';'))].join('\r\n');
 const blob=new Blob(['\ufeff',text],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob), a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)
}
['q','author','type','year'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',()=>{page=0;render()}));
$('results').addEventListener('click',e=>{const b=e.target.closest('[data-save]');if(!b)return;const id=b.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);render()});
$('reset').addEventListener('click',()=>{$('q').value='';$('author').value='';$('type').value='';$('year').value='';savedOnly=false;$('showSaved').innerHTML='★ Merkliste anzeigen (<span id="savedCount">'+saved.size+'</span>)';page=0;render()});
$('showSaved').addEventListener('click',()=>{savedOnly=!savedOnly;$('showSaved').innerHTML=(savedOnly?'Alle Titel anzeigen':'★ Merkliste anzeigen')+' (<span id="savedCount">'+saved.size+'</span>)';page=0;render()});
$('exportSaved').addEventListener('click',()=>csvExport(ITEMS.filter(x=>saved.has(x.id)),'merkliste-wedemark.csv'));
$('exportResults').addEventListener('click',()=>csvExport(filtered(),'suchergebnisse-wedemark.csv'));
$('prev').addEventListener('click',()=>{page--;render()});$('next').addEventListener('click',()=>{page++;render()});
render();
</script></body></html>
