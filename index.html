t": "", "language": "", "date": "2002", "notes": ""}, {"id": "ZWY73YGK", "title": "Welfenschriften", "authors": ["Hummel, Carz"], "authorText": "Hummel, Carz", "year": "", "type": "document", "publication": "", "publisher": "", "place": "", "pages": "", "isbn": "", "doi": "", "url": "", "archive": "Vorhanden in der GWLB Hannover (verschiedene Signaturen) von 1.2007 bis 110.2017", "abstract": "", "language": "", "date": "", "notes": ""}, {"id": "PAZXJMIB", "title": "Ein Faustkeil aus dem alten Leinetal in der Wietze-Niederung bei Meitze, Gem. Wedemark, Ldkr. Hannover", "authors": ["Oldenburg, Heinz"], "authorText": "Oldenburg, Heinz", "year": "1985", "type": "journalArticle", "publication": "", "publisher": "NN", "place": "", "pages": "", "isbn": "", "doi": "10.11588/DIGLIT.75709.14", "url": "https://digi.ub.uni-heidelberg.de/diglit/kunde1985/0301", "archive": "", "abstract": "", "language": "de", "date": "1985", "notes": ""}, {"id": "ILEF4RLL", "title": "Über glaziäre Stauchungen in den Mellendorfer und Brelinger Bergen nördlich von Hannover .", "authors": ["Lang, Hans Dietrich"], "authorText": "Lang, Hans Dietrich", "year": "1964", "type": "journalArticle", "publication": "E&G Quaternary Science Journal", "publisher": "", "place": "", "pages": "207-220", "isbn": "", "doi": "10.3285/eg.15.1.16", "url": "https://egqsj.copernicus.org/articles/15/207/1964/", "archive": "", "abstract": "Abstract. The Mellendorf and Brelingen hills are part of the large chain of contorted endmoraines (Drenthe stadial) which can be followed from the Netherlands to the region north of Braunschweig. The clay occurrences near Mellendorf, parts of them well-known for a long time, are blocks or overthrusts transported there by glacial movements. The dip of the tilted beds and the strike of clay occurrences indicate glacial thrusts from ENE, from W, TOW and from N. The dip of tilted sands and gravels in the Brelingen hills, however, points to a direction of ice motion from N to S. Micropalaeontological investigations in the clays of the Mellendorf and Brelingen hills have revealed the existence of foraminifera of Lower Cretaceous age, beginning with the Hauterivian, and a few of them also of the Upper Cretaceous. The proved thrust directions point to regions where the respective old beds of the Lower Cretaceous are exposed. Accordingly the length of transport must have been about 7—8 km. The slightly undulating country around Mellendorf is covered by a sheet of till. After the contortion, the ice advanced over the Mellendorf hills in a southern direction. The Brelingen hills, showing very recent relief and without a covering till, are younger and belong to a later recessional phase; the ice did not override them. The investigations demonstrate that three, perhaps even four, glacial thrusts of the Drenthe stadial took part in the genesis of this region.", "language": "en", "date": "1964-11-01", "notes": ""}, {"id": "THLD6T97", "title": "Bissendorf (Hannover) Apotheke", "authors": ["Kaletsch, Heinrich"], "authorText": "Kaletsch, Heinrich", "year": "2023", "type": "dataset", "publication": "", "publisher": "Zenodo", "place": "", "pages": "", "isbn": "", "doi": "10.5281/ZENODO.10090492", "url": "https://zenodo.org/doi/10.5281/zenodo.10090492", "archive": "", "abstract": "Historical questionnaire/s 1924/1948 and index cards, partly selected enclosures regarding the history of a German pharmacy, catalogued via Kalliope portal (Historischer Fragebogen 1924/1948 und Karteikarten, ggf. gemeinfreie Anlagen zur Apothekengeschichte; als Katalog dient das Nachlassportal Kalliope): https://kalliope-verbund.info/DE-611-BF-70963 [Funktion: Im Findbuch anzeigen]   Please note: The Kalliope catalogue entry might indicate related material in the archival folder which cannot be published due to copyright or other legal restrictions (NB: Das Katalogisat bei Kalliope kann auch auf Materialien - teils erheblichen Umfangs - verweisen, die aus archiv- oder urheberrechtlichen Gründen nicht veröffentlicht werden dürfen).", "language": "de", "date": "2023-11-09", "notes": ""}, {"id": "P9IJUCYD", "title": "teat", "authors": [], "authorText": "", "year": "", "type": "report", "publication": "", "publisher": "", "place": "", "pages": "", "isbn": "", "doi": "", "url": "", "archive": "", "abstract": "", "language": "", "date": "", "notes": ""}, {"id": "2PKI3YSD", "title": "Unser Moor: Geschichte des Bissendorfer Moores", "authors": ["Löns, Hermann"], "authorText": "Löns, Hermann", "year": "2010", "type": "report", "publication": "", "publisher": "", "place": "", "pages": "", "isbn": "", "doi": "", "url": "", "archive": "Vorhanden im Gemeindearchiv Wedemark (GemA WDM, BIB, 5)", "abstract": "", "language": "", "date": "2010", "notes": ""}, {"id": "U3GVQ4J6", "title": "Wedemärker Kulturtage; in der Grundschule Mellendorf", "authors": [], "authorText": "", "year": "1996", "type": "report", "publication": "", "publisher": "", "place": "", "pages": "", "isbn": "", "doi": "", "url": "", "archive": "Vorhanden im Gemeindearchiv Wedemark (GemA WDM, BIB, 33)", "abstract": "", "language": "", "date": "1996", "notes": ""}, {"id": "LXMFTVXT", "title": "100 Jahre Mellendorfer Turn - Verein", "authors": ["Mellendorfer Turnverein"], "authorText": "Mellendorfer Turnverein", "year": "2019", "type": "book", "publication": "", "publisher": "", "place": "", "pages": "", "isbn": "", "doi": "", "url": "", "archive": "Vorhanden im Gemeindearchiv Wedemark (GemA WDM, BIB, 130)", "abstract": "", "language": "", "date": "2019", "notes": ""}, {"id": "9S8RU6G4", "title": "Tatort Wedemark", "authors": [], "authorText": "", "year": "2025", "type": "book", "publication": "", "publisher": "", "place": "", "pages": "", "isbn": "", "doi": "", "url": "", "archive": "Vorhanden im Gemeindearchiv Wedemark (GemA WDM, BIB, 155)", "abstract": "", "language": "", "date": "2025", "notes": ""}, {"id": "VR5LLEYJ", "title": "Jubiläumsturnier Tischtennis", "authors": ["Mellendorfer Turnverein (Abt ellendorf", "year": "2006", "type": "document", "publication": "", "publisher": "", "place": "", "pages": "", "isbn": "", "doi": "", "url": "", "archive": "Vorhanden im Gemeindearchiv Wedemark (GemA WDM, BIB, 164)", "abstract": "", "language": "", "date": "2006", "notes": ""}, {"id": "4R54VSJT", "title": "10 Jahre Chronik der Bissendorfer Panther", "authors": ["Förderverein der Bissendorfer Panther"], "authorText": "Förderverein der Bissendorfer Panther", "year": "2008", "type": "document", "publication": "", "publisher": "", "place": "", "pages": "", "isbn": "", "doi": "", "url": "", "archive": "Vorhanden im Gemeindearchiv Wedemark (GemA WDM, BIB, 165)", "abstract": "", "language": "", "date": "2008", "notes": ""}, {"id": "VZPW4WMW", "title": "50 Jahre Damen SG Bissendorf", "authors": ["Schützengesellschaft Bissendorf"], "authorText": "Schützengesellschaft Bissendorf", "year": "2017", "type": "document", "publication": "", "publisher": "", "place": "", "pages": "", "isbn": "", "doi": "", "url": "", "archive": "Vorhanden im Gemeindearchiv Wedemark (GemA WDM, BIB, 166)", "abstract": "", "language": "", "date": "2017", "notes": ""}, {"id": "2FHDPA6D", "title": "50 Jahre Tennisclub Bissendorf e.V.", "authors": ["ohne Angabe"], "authorText": "ohne Angabe", "year": "2009", "type": "document", "publication": "", "publisher": "", "place": "", "pages": "", "isbn": "", "doi": "", "url": "", "archive": "Vorhanden im Gemeindearchiv Wedemark (GemA WDM, BIB, 167)", "abstract": "", "language": "", "date": "2009", "notes": ""}, {"id": "82UJ55K5", "title": "test für notion", "authors": [], "authorText": "", "year": "", "type": "book", "publication": "", "publisher": "", "place": "", "pages": "", "isbn": "", "doi": "", "url": "", "archive": "", "abstract": "", "language": "", "date": "", "notes": ""}];
const $ = id => document.getElementById(id);
const PAGE_SIZE = 20;
let page = 0, savedOnly = false;
let saved = new Set();
try { saved = new Set(JSON.parse(localStorage.getItem('wedemark-literatur-merkliste') || '[]')); } catch(e) {}
const typeNames = {book:'Buch',document:'Dokument',report:'Bericht',bookSection:'Buchkapitel',journalArticle:'Zeitschriftenartikel',magazineArticle:'Magazinartikel',dataset:'Datensatz'};
function labelType(t){return typeNames[t] || t || 'Nicht angegeben'}
function options(id, vals, formatter=x=>x){const el=$(id); [...new Set(vals.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de',{numeric:true})).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=formatter(v);el.appendChild(o)})}
options('author', ITEMS.flatMap(x=>x.authors));
options('type', ITEMS.map(x=>x.type), labelType);
options('year', ITEMS.map(x=>x.year));
function allText(x){return [x.title,x.authorText,x.year,x.type,x.publication,x.publisher,x.place,x.isbn,x.doi,x.archive,x.abstract,x.notes].join(' ').toLocaleLowerCase('de')}
function filtered(){
 const q=$('q').value.trim().toLocaleLowerCase('de'), a=$('author').value, t=$('type').value, y=$('year').value;
 return ITEMS.filter(x=>(!q||allText(x).includes(q))&&(!a||x.authors.includes(a))&&(!t||x.type===t)&&(!y||x.year===y)&&(!savedOnly||saved.has(x.id)))
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persist(){try{localStorage.setItem('wedemark-literatur-merkliste',JSON.stringify([...saved]))}catch(e){} $('savedCount').textContent=saved.size}
function render(){
 const list=filtered(), pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE)); page=Math.min(page,pages-1);
 $('summary').textContent=`${list.length} von ${ITEMS.length} Titeln${savedOnly?' · Merkliste':''}`;
 $('results').innerHTML=list.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE).map(x=>{
  const meta=[x.authorText || 'Autor/in nicht angegeben',x.year || 'Jahr nicht angegeben',labelType(x.type)].join(' · ');
  const extra=[x.publication,x.publisher,x.place,x.pages?`${x.pages} Seiten`: '',x.isbn?`ISBN ${x.isbn}`:'',x.doi?`DOI ${x.doi}`:'',x.archive?`Nachweis: ${x.archive}`:''].filter(Boolean).join(' · ');
  const link=x.url?`<p class="details"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Online öffnen</a></p>`:'';
  return `<article class="entry"><button class="star ${saved.has(x.id)?'saved':''}" data-save="${esc(x.id)}" aria-pressed="${saved.has(x.id)}">${saved.has(x.id)?'★ Gemerkt':'☆ Merken'}</button><h3>${esc(x.title)}</h3><div class="meta">${esc(meta)}</div>${extra?`<p class="details">${esc(extra)}</p>`:''}${x.abstract?`<p class="details">${esc(x.abstract)}</p>`:''}${link}</article>`
 }).join('') || '<div class="empty">Keine passenden Titel gefunden. Ändern Sie Ihre Filter oder den Suchbegriff.</div>';
 $('pageInfo').textContent=`Seite ${page+1} von ${pages}`;
 $('prev').disabled=page===0; $('next').disabled=page>=pages-1;
 persist();
}
function csvExport(list, filename){
 const cols=[['Titel','title'],['Autor/in','authorText'],['Jahr','year'],['Publikationstyp','type'],['Publikation','publication'],['Verlag','publisher'],['Ort','place'],['Seiten','pages'],['ISBN','isbn'],['DOI','doi'],['URL','url'],['Nachweis','archive']];
 const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const text=[cols.map(c=>cell(c[0])).join(';'),...list.map(x=>cols.map(c=>cell(c[1]==='type'?labelType(x[c[1]]):x[c[1]])).join(';'))].join('\r\n');
 const blob=new Blob(['\ufeff',text],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob), a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)
}
['q','author','type','year'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',()=>{page=0;render()}));
$('results').addEventListener('click',e=>{const b=e.target.closest('[data-save]');if(!b)return;const id=b.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);render()});
$('reset').addEventListener('click',()=>{$('q').value='';$('author').value='';$('type').value='';$('year').value='';savedOnly=false;$('showSaved').textContent='★ Merkliste anzeigen (';page=0;render()});
$('showSaved').addEventListener('click',()=>{savedOnly=!savedOnly;$('showSaved').innerHTML=(savedOnly?'Alle Titel anzeigen':'★ Merkliste anzeigen')+' (<span id="savedCount">'+saved.size+'</span>)';page=0;render()});
$('exportSaved').addEventListener('click',()=>csvExport(ITEMS.filter(x=>saved.has(x.id)),'merkliste-wedemark.csv'));
$('exportResults').addEventListener('click',()=>csvExport(filtered(),'suchergebnisse-wedemark.csv'));
$('prev').addEventListener('click',()=>{page--;render()});$('next').addEventListener('click',()=>{page++;render()});
render();
</script></body></html>
